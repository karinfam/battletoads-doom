# Compiles the doom-wasm fork with the pinned Emscripten and uploads the
# three engine files. Download the artifact into build/engine/ on machines
# that cannot build locally (Windows without WSL or Docker).
name: engine

on:
  workflow_dispatch:
  push:
    paths:
      - engine
      - engine.emsdk-version
      - scripts/build-engine

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-engine
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: build/engine/
          if-no-files-found: error
